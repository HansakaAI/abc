name: Node.js CI/CD Workflow

on:
  schedule:
    # පැය 5.5 කින් එකවර — UTC වේලාවෙන්
    - cron: '30 0,11,22 * * *'
    - cron: '30 5,16 * * *'
  workflow_dispatch:   # අතින් manually run කරන්නත්

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330   # පැය 5.5 ට පස්සේ force kill වෙනවා
    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install dependencies
      run: npm install

    - name: Start application
      run: npm start
